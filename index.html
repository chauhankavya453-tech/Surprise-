<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3ef">
  <title>Our Wedding Invitation · Apeksha & Abhinav</title>
  <style>
    :root {
      --ease: cubic-bezier(.22, 1, .36, 1);
      --flip: cubic-bezier(.2, .8, .25, 1);
      --rose: #9b6267;
      --rose-deep: #7b434a;
      --ink: #4a3333;
      --muted: #826c6a;
      --paper: #fffdf9;
      --edge: rgba(103, 62, 64, .18);
      --shadow: 0 28px 55px rgba(86, 49, 49, .18);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.96), transparent 26rem),
        radial-gradient(circle at 88% 92%, rgba(236,194,187,.68), transparent 30rem),
        #f8f3ef;
    }

    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 3vw, 2rem);
    }

    .invitation {
      width: min(100%, 64rem);
      min-height: min(94svh, 52rem);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      align-items: center;
      text-align: center;
    }

    .heading { padding-top: .25rem; }
    .eyebrow {
      margin: 0 0 .55rem;
      color: var(--rose);
      font: 600 .68rem/1.2 system-ui, sans-serif;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.04em;
    }
    .subheading {
      margin: .7rem auto 0;
      color: var(--muted);
      font-size: clamp(.86rem, 1.8vw, 1rem);
    }

    .stage {
      width: 100%;
      display: grid;
      place-items: center;
      perspective: 2200px;
    }

    .scene {
      position: relative;
      width: min(88vw, 37rem);
      height: min(67vw, 27rem);
      min-height: 16rem;
      transform-style: preserve-3d;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .scene:focus-visible {
      outline: 3px solid rgba(155, 98, 103, .7);
      outline-offset: 12px;
      border-radius: 1rem;
    }

    .state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform-style: preserve-3d;
    }
    .state.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .state.leaving {
      visibility: visible;
      pointer-events: none;
    }

    .envelope {
      position: absolute;
      inset: 0;
      filter: drop-shadow(var(--shadow));
      transform-style: preserve-3d;
      transition: opacity .8s var(--ease), transform .9s var(--ease), filter .9s var(--ease);
    }
    .envelope__body {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: .7rem;
      background: linear-gradient(145deg, #f0d2cb, #e2b8b3);
      box-shadow: inset 0 0 0 1px rgba(126, 75, 75, .14);
    }
    .envelope__body::before,
    .envelope__body::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(145deg, transparent 49.7%, rgba(128, 75, 76, .2) 50%, transparent 50.4%);
    }
    .envelope__body::before {
      clip-path: polygon(0 0, 50% 53%, 100% 0, 100% 100%, 0 100%);
    }
    .envelope__body::after {
      clip-path: polygon(0 100%, 50% 47%, 100% 100%);
    }

    .flap {
      position: absolute;
      z-index: 3;
      inset: 0 0 auto;
      height: 61%;
      transform-origin: 50% 0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: linear-gradient(150deg, #f7e1db, #e2b6b1);
      transition: transform 1.05s var(--ease);
    }

    .seal {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 54%;
      width: clamp(2.8rem, 9vw, 3.7rem);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      color: #fff;
      background: var(--rose);
      border: .28rem solid rgba(255,255,255,.18);
      box-shadow: 0 5px 13px rgba(100, 57, 57, .2);
      font-size: 1rem;
      transition: opacity .3s ease, transform .5s var(--ease);
    }

    .envelope.opening .flap {
      transform: rotateX(180deg);
    }
    .envelope.opening .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.5) rotate(20deg);
    }
    .envelope.leaving {
      opacity: 0;
      transform: translateY(35%) scale(.84);
      filter: blur(4px);
    }

    .single-page {
      position: relative;
      width: min(46%, 18rem);
      aspect-ratio: 5 / 7;
      overflow: hidden;
      border-radius: .3rem;
      background: var(--paper);
      box-shadow: 0 26px 48px rgba(75, 43, 44, .18);
    }
    .single-page img,
    .book-page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .cover-state .single-page {
      transform: translateY(45%) scale(.92);
      opacity: 0;
      transition: transform 1.2s var(--ease), opacity .7s ease;
    }
    .cover-state.active .single-page {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .cover-state.leaving .single-page {
      opacity: 0;
      transform: translateY(0) scale(.98);
    }

    .book-spread {
      position: relative;
      width: min(92vw, 37rem);
      aspect-ratio: 10 / 7;
      display: flex;
      transform-style: preserve-3d;
      filter: drop-shadow(0 26px 48px rgba(75, 43, 44, .18));
    }
    .book-page {
      position: relative;
      width: 50%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(85, 52, 54, .18);
      backface-visibility: hidden;
      transform-style: preserve-3d;
      transition: transform 1.2s var(--flip), opacity .35s ease;
    }
    .book-page:first-child {
      border-radius: .42rem 0 0 .42rem;
      transform-origin: right center;
      transform: rotateY(90deg);
    }
    .book-page:last-child {
      border-radius: 0 .42rem .42rem 0;
      transform-origin: left center;
      transform: rotateY(-90deg);
    }
    .spread-state.active .book-page:first-child,
    .spread-state.active .book-page:last-child {
      transform: rotateY(0);
      transition-delay: .18s;
    }
    .spread-state.leaving .book-page:first-child {
      transform: rotateY(180deg);
      transition-delay: 0s;
    }
    .spread-state.leaving .book-page:last-child {
      transform: rotateY(-180deg);
      transition-delay: .08s;
    }

    .book-page::after,
    .single-page::after {
      content: '';
      position: absolute;
      inset: .42rem;
      border: 1px solid rgba(85, 52, 54, .15);
      pointer-events: none;
    }

    .final-state .single-page {
      transform: translateY(14%) scale(.95);
      opacity: 0;
      transition: transform 1.1s var(--ease), opacity .7s ease;
    }
    .final-state.active .single-page {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .instruction {
      margin: 0;
      min-height: 1.2rem;
      color: var(--muted);
      font: 600 .68rem/1.2 system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .instruction::before,
    .instruction::after {
      content: '✦';
      color: #bb8d4a;
      margin: 0 .3rem;
    }

    @media (max-width: 560px) {
      .scene {
        width: 92vw;
        height: clamp(16rem, 64vw, 24rem);
      }
      .book-spread {
        width: 92vw;
      }
      .single-page {
        width: min(48%, 16rem);
      }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .scene { width: min(86vw, 37rem); height: 74svh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="invitation" aria-label="Interactive wedding invitation">
      <header class="heading">
        <p class="eyebrow">A little something special</p>
        <h1>Apeksha &amp; Abhinav</h1>
        <p class="subheading">A celebration of love, family and forever</p>
      </header>

      <div class="stage">
        <div id="scene" class="scene" role="button" tabindex="0" aria-label="Open the wedding envelope" aria-pressed="false">
          <div class="state envelope-state active">
            <div class="envelope">
              <div class="envelope__body"></div>
              <div class="flap"></div>
              <div class="seal">♥</div>
            </div>
          </div>

          <div class="state cover-state">
            <div class="single-page">
              <img src="love%201%20.png" alt="Wedding invitation cover">
            </div>
          </div>

          <div class="state spread-state">
            <div class="book-spread">
              <div class="book-page">
                <img src="love%203%20.png" alt="Invitation left page">
              </div>
              <div class="book-page">
                <img src="love%202%20.png" alt="Invitation right page">
              </div>
            </div>
          </div>

          <div class="state final-state">
            <div class="single-page">
              <img src="love%203%20.png" alt="Invitation final page">
            </div>
          </div>
        </div>
      </div>

      <p id="instruction" class="instruction" aria-live="polite">Click the envelope to open</p>
    </section>
  </main>

  <script>
    (() => {
      const scene = document.getElementById('scene');
      const instruction = document.getElementById('instruction');
      const states = [...scene.querySelectorAll('.state')];
      const messages = [
        'Click the envelope to open',
        'Click the card to open the invitation',
        'Click the pages to close the book',
        'Your invitation is ready'
      ];

      let step = 0;
      let busy = false;

      const activate = (index) => {
        states.forEach((state, i) => state.classList.toggle('active', i === index));
      };

      const openSequence = () => {
        if (busy || step >= 3) return;
        busy = true;

        if (step === 0) {
          const envelope = states[0].querySelector('.envelope');
          envelope.classList.add('opening');
          setTimeout(() => {
            envelope.classList.add('leaving');
            activate(1);
            step = 1;
            instruction.textContent = messages[step];
            scene.setAttribute('aria-label', 'Open the invitation card');
            setTimeout(() => busy = false, 850);
          }, 1050);
          return;
        }

        if (step === 1) {
          states[1].classList.add('leaving');
          setTimeout(() => {
            activate(2);
            step = 2;
            instruction.textContent = messages[step];
            scene.setAttribute('aria-label', 'Flip the invitation pages');
            setTimeout(() => busy = false, 1200);
          }, 220);
          return;
        }

        const spread = states[2];
        spread.classList.add('leaving');
        setTimeout(() => {
          activate(3);
          step = 3;
          instruction.textContent = messages[step];
          scene.setAttribute('aria-label', 'Final wedding invitation page');
          setTimeout(() => busy = false, 1100);
        }, 900);
      };

      scene.addEventListener('click', openSequence);
      scene.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openSequence();
        }
      });
    })();
  </script>
</body>
</html>
