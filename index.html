<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f3ef">
<title>Apeksha &amp; Abhinav · Wedding Invitation</title>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--rose:#9b6267;--ink:#533b3b;--muted:#8b7270;--paper:#fffdf9}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;overflow:hidden;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at 12% 8%,#fff,transparent 26rem),radial-gradient(circle at 88% 92%,#ecc2bb,transparent 30rem),#f8f3ef}
.page{min-height:100svh;display:grid;place-items:center;padding:1rem}.invitation{width:min(100%,64rem);min-height:min(94svh,52rem);display:grid;grid-template-rows:auto minmax(0,1fr) auto;align-items:center;text-align:center}.heading{padding-top:.25rem}.eyebrow{margin:0 0 .55rem;color:var(--rose);font:600 .68rem/1.2 system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.8rem,5vw,3.45rem);font-weight:400;line-height:1;letter-spacing:-.035em}.subheading{margin:.65rem auto 0;color:var(--muted);font-size:clamp(.82rem,1.8vw,1rem)}
.stage{width:100%;min-height:0;display:grid;place-items:center;perspective:1800px}.scene{position:relative;width:min(88vw,37rem);height:min(67vw,27rem);min-height:16rem;transform-style:preserve-3d;-webkit-tap-highlight-color:transparent}.scene:focus-visible{outline:3px solid #9b6267a6;outline-offset:12px;border-radius:1rem}
.envelope{position:absolute;inset:0;z-index:30;transform-style:preserve-3d;filter:drop-shadow(0 28px 55px #57353533);transition:opacity .85s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}.envelope__body{position:absolute;inset:0;overflow:hidden;border-radius:.65rem;background:linear-gradient(145deg,#f0d2cb,#e2b8b3);box-shadow:inset 0 0 0 1px #7e4b4b24}.envelope__body:before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,transparent 49.7%,#804b4c33 50%,transparent 50.4%);clip-path:polygon(0 0,50% 53%,100% 0,100% 100%,0 100%)}.envelope__body:after{content:'';position:absolute;inset:0;background:linear-gradient(35deg,transparent 49.7%,#804b4c24 50%,transparent 50.4%);clip-path:polygon(0 100%,50% 47%,100% 100%)}.flap{position:absolute;z-index:3;inset:0 0 auto;height:61%;transform-origin:50% 0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(150deg,#f7e1db,#e2b6b1);transition:transform 1.05s var(--ease)}.seal{position:absolute;z-index:5;left:50%;top:54%;width:clamp(2.8rem,9vw,3.7rem);aspect-ratio:1;display:grid;place-items:center;transform:translate(-50%,-50%);border-radius:50%;color:#fff;background:var(--rose);border:.28rem solid #fff6;box-shadow:0 5px 13px #64393933;transition:opacity .35s ease,transform .65s var(--ease)}
.book{position:absolute;z-index:5;top:50%;left:50%;width:min(92vw,37rem);aspect-ratio:10/7;transform:translate(-50%,-50%) translateY(40%) scale(.76);transform-style:preserve-3d;opacity:0;filter:drop-shadow(0 28px 50px #4b2b2c33);transition:transform 1.2s var(--ease),opacity .65s ease}.spread{position:absolute;inset:0;display:none;opacity:0;transform-style:preserve-3d}.page-panel,.cover-face,.final-face{position:absolute;overflow:hidden;background:var(--paper);border:1px solid #75454c2b;backface-visibility:hidden}.page-panel{top:0;width:50%;height:100%}.page-left{left:0;border-radius:.42rem 0 0 .42rem}.page-right{right:0;border-radius:0 .42rem .42rem 0}.page-panel:after,.cover-face:after,.final-face:after{content:'';position:absolute;inset:.42rem;border:1px solid #75454c24;pointer-events:none}.page-image,.cover-face img,.final-face img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
/* The only page in the first revealed state is this cover. */.cover{position:absolute;z-index:12;top:0;left:25%;width:50%;height:100%;display:none;transform-origin:right center;transform-style:preserve-3d}.cover-face{inset:0;border-radius:.42rem}.cover-face img{position:absolute}.cover-front{display:block}
/* The final state is one centered love 3 page. */.final-page{position:absolute;z-index:15;top:0;left:25%;width:50%;height:100%;display:none;transform-origin:left center;transform-style:preserve-3d}.final-face{inset:0;border-radius:.42rem}.instruction{margin:0;min-height:1.2rem;color:var(--muted);font:600 .68rem/1.2 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}.instruction:before{content:'✦  ';color:#bb8d4a}.instruction:after{content:'  ✦';color:#bb8d4a}
/* State 1: envelope opens and only love 1 is mounted visually. */.scene.state-cover .flap{transform:rotateX(180deg);z-index:1}.scene.state-cover .seal{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(20deg);pointer-events:none}.scene.state-cover .book{opacity:1;transform:translate(-50%,-50%) translateY(-36%) scale(.76);transition-delay:.28s}.scene.state-cover .envelope{opacity:0;transform:translateY(45%) scale(.82);filter:blur(4px);transition-delay:1.05s;pointer-events:none}.scene.state-cover .cover{display:block}
/* State 2: the cover is removed, then the two inside images are mounted as a spread. */.scene.state-spread .book{opacity:1;transform:translate(-50%,-50%) scale(1)}.scene.state-spread .spread{display:block;opacity:1;animation:spreadIn 1.05s var(--ease) both}.scene.state-spread .cover{display:none}
/* State 3: the spread is removed, then only love 3 is mounted. */.scene.state-final .book{opacity:1;transform:translate(-50%,-50%) scale(.76)}.scene.state-final .spread{display:none}.scene.state-final .final-page{display:block;animation:finalIn 1.1s var(--ease) both}
@keyframes spreadIn{from{opacity:0;transform:rotateY(-70deg) scale(.9)}to{opacity:1;transform:rotateY(0) scale(1)}}@keyframes finalIn{from{opacity:0;transform:rotateY(90deg) scale(.92)}to{opacity:1;transform:rotateY(0) scale(1)}}
@media(max-width:560px){.invitation{min-height:94svh}.scene{width:92vw;height:clamp(16rem,64vw,24rem)}.book{width:92vw}}@media(orientation:landscape) and (max-height:560px){.invitation{min-height:96svh}.scene{width:min(86vw,37rem);height:74svh}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="page"><section class="invitation" aria-label="Interactive wedding invitation"><header class="heading"><p class="eyebrow">A little something special</p><h1>Apeksha &amp; Abhinav</h1><p class="subheading">A celebration of love, family and forever</p></header><div class="stage"><div id="scene" class="scene" role="group" aria-label="Wedding invitation"><div class="book"><div class="spread"><section class="page-panel page-left"><img class="page-image" src="love%203%20.png" alt="Wedding invitation inner left page"></section><section class="page-panel page-right" data-action="final"><img class="page-image" src="love%202%20.png" alt="Wedding invitation inner right page"></section></div><div class="cover" data-action="spread"><div class="cover-face cover-front"><img src="love%201%20.png" alt="Wedding invitation front cover"></div></div><div class="final-page"><div class="final-face"><img src="love%203%20.png" alt="Wedding invitation final page"></div></div></div><div class="envelope" data-action="cover"><div class="envelope__body"></div><div class="flap"></div><div class="seal">♥</div></div></div></div><p id="instruction" class="instruction" aria-live="polite">Click the envelope to open</p></section></main>
<script>
(()=>{const scene=document.getElementById('scene'),instruction=document.getElementById('instruction');let state='envelope',locked=false;const text={envelope:'Click the envelope to open',cover:'Click love 1 to open the card',spread:'Click love 2 to fold the card closed',final:'Your invitation is ready'};function setState(next){if(locked)return;locked=true;state=next;scene.className='scene state-'+(next==='envelope'?'envelope':next);instruction.textContent=text[next];scene.setAttribute('aria-label',text[next]);const delay=next==='cover'?1750:next==='spread'?1250:next==='final'?1350:0;setTimeout(()=>locked=false,delay)}scene.addEventListener('click',event=>{if(locked)return;const action=event.target.closest('[data-action]')?.dataset.action;if(state==='envelope'&&action==='cover')setState('cover');else if(state==='cover'&&action==='spread')setState('spread');else if(state==='spread'&&action==='final')setState('final')});scene.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();if(state==='envelope')setState('cover');else if(state==='cover')setState('spread');else if(state==='spread')setState('final')}})})();
</script>
</body></html>
